<div class="flex items-center justify-center bg-gray-100 p-4">
    <div class="w-full max-w-sm rounded-lg bg-white p-6 shadow">
        <h1 class="mb-3 text-center text-2xl font-bold">Registration Form</h1>

        <form (submit)="onSubmit($event)" class="space-y-4">
            <div>
                <label class="mb-2 block text-sm font-medium text-gray-700">First name</label>
                <input
                    type="text"
                    [formField]="formModel.firstName"
                    class="w-full rounded-md border border-gray-300 p-2 outline-none focus:border-blue-500"
                />
            </div>
            <div>
                <label class="mb-2 block text-sm font-medium text-gray-700">Last name</label>
                <input
                    type="text"
                    [formField]="formModel.lastName"
                    class="w-full rounded-md border border-gray-300 p-2 outline-none focus:border-blue-500"
                />
            </div>
            <button
                type="submit"
                class="w-full rounded-md bg-blue-600 p-2 text-white hover:bg-blue-700"
            >
                Submit
            </button>
        </form>
    </div>
</div>
