<h2 class="text-center font-bold">Fetch API Using resource()</h2>
<div class="mb-2">
    <button (click)="fetchRandomUser()" class="btn-primary cursor-pointer">
        @if (userResource.isLoading()) {
            Fetching User...
        } @else {
            Fetch Random User
        }
    </button>
</div>

<div class="border-2 border-gray-400 border-dashed p-2">
    <div class="flex items-center gap-x-2 border-b border-gray-300 mb-2 py-2">
        <div>
            <span class="font-semibold mr-1">Fetch User ID:</span>
            <span class="font-bold text-red-500">{{ userId() }}</span>
        </div>
        <div>
            <span class="font-semibold mr-1">Loading:</span>
            <span class="font-bold text-red-500">{{ userResource.isLoading() }}</span>
        </div>
    </div>
    <h4>Output</h4>
    <pre>{{ userResource.value() | json }}</pre>
</div>
