<h2 class="text-center font-bold my-3">Bridging Angular Input Signals with Service-Level Resource API</h2>
<div class="mb-1">
    <button (click)="nextTodo()" class="btn-primary cursor-pointer">Get Next Todo</button>
</div>
<div class="box mb-2 border-2 border-dashed border-gray-400 p-3">
    <app-poc-input-service-bridge-todo [todoId]="todoId()"></app-poc-input-service-bridge-todo>
</div>

<div class="mb-1">
    <button (click)="nextPost()" class="btn-primary cursor-pointer">Get Next Post</button>
</div>
<div class="border-2 border-dashed border-gray-400 p-3">
    <app-poc-input-service-bridge-post [postId]="postId()"></app-poc-input-service-bridge-post>
</div>
