<h2 class="text-center font-bold my-3">Reuseable service using resource()</h2>
<div class="mb-2">
    <button (click)="updateNumber()" class="btn-primary cursor-pointer">Fetch Todo</button>
</div>
<div class="border-2 border-gray-400 border-dashed p-2">
    <div class="flex items-center gap-x-2 border-b border-gray-300 mb-2 py-2">
        <div>
            <span class="font-semibold mr-1">Fetch Post ID:</span>
            <span class="font-bold text-red-500">{{ id }}</span>
        </div>
        <div>
            <span class="font-semibold mr-1">Loading:</span>
            <span class="font-bold text-red-500">{{ isLoading }}</span>
        </div>
    </div>
    <h4>Output</h4>
    <pre>{{ dataSource | json }}</pre>
</div>
