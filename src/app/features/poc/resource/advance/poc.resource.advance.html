<h2 class="text-center font-bold my-3">Data Collator Service Advance</h2>
<div class="space-y-6">
    <!-- Page Header -->
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h1 class="text-xl font-semibold">Todos</h1>
            <p class="mt-1 text-sm">Manage your tasks and activities.</p>
        </div>
    </div>

    <!-- Filters -->
    <div class="rounded-xl border border-gray-200 p-4 shadow-sm">
        <form [formRoot]="formModel">
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
                <!-- Status Filter -->
                <select
                    [formField]="formModel.sortBy"
                    (change)="handleSort()"
                    class="rounded-lg cursor-pointer border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                >
                    <option value="">Sort By</option>
                    <option value="todo">Todo</option>
                    <option value="completed">Completed</option>
                    <option value="userId">User Id</option>
                </select>

                <!-- Sort -->
                <select
                    [formField]="formModel.order"
                    (change)="handleSort()"
                    class="rounded-lg cursor-pointer border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                >
                    <option value="">Order</option>
                    <option value="asc">Ascending</option>
                    <option value="desc">Descending</option>
                </select>

                <div class="flex items-center gap-2 ml-auto">
                    @if (hasPrevious) {
                        <button
                            (click)="getPreviousPage()"
                            type="button"
                            class="rounded-lg border cursor-pointer border-gray-200 px-3 py-2 text-sm"
                        >
                            Previous
                        </button>
                    }

                    @if (hasNext) {
                        <button
                            (click)="getNextPage()"
                            type="button"
                            class="rounded-lg border cursor-pointer border-gray-200 px-3 py-2 text-sm"
                        >
                            Next
                        </button>
                    }
                </div>
            </div>
        </form>
    </div>

    <!-- Todo List -->
    <div class="space-y-3">
        @for (todo of dataSource; track $index) {
            <!-- Todo Card -->
            <article
                class="rounded-xl border border-gray-200 shadow-sm transition hover:border-gray-300 p-3.5"
            >
                <div class="flex items-start gap-4">
                    <!-- Todo Content -->
                    <div class="min-w-0 flex-1">
                        <div
                            class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between"
                        >
                            <div class="min-w-0">
                                <h3 class="text-sm font-semibold leading-6">
                                    {{ todo.todo }}
                                </h3>
                                <div
                                    class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs"
                                >
                                    <span class="inline-flex items-center gap-1">
                                        <!-- <fa-icon [icon]="faHashtag"></fa-icon> -->
                                        Todo #{{ todo.id }}
                                    </span>
                                </div>
                            </div>

                            <!-- Status -->
                            @if (todo.completed) {
                                <span
                                    class="inline-flex w-fit shrink-0 items-center rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700"
                                >
                                    Completed
                                </span>
                            } @else {
                                <span
                                    class="inline-flex w-fit shrink-0 items-center rounded-full bg-amber-100 px-3 py-1 text-xs font-semibold text-amber-700"
                                >
                                    Pending
                                </span>
                            }
                        </div>

                        <!-- Actions -->
                        <div
                            class="mt-4 flex items-center justify-between border-t border-gray-100 pt-3"
                        >
                            <span class="text-xs"> Created by User #{{ todo.userId }} </span>
                        </div>
                    </div>
                </div>
            </article>
        }
    </div>
</div>
