<div class="grid h-screen grid-rows-[auto_minmax(0,1fr)]">
    <app-example-responsive-navigation
        (toggleSidebarChange)="toggleSidebar($event)"
    ></app-example-responsive-navigation>
    <div
        [class.md:grid-cols-[0_minmax(0,1fr)_auto]]="!sidebarOpen()"
        [class.md:grid-cols-[250px_minmax(0,1fr)_auto]]="sidebarOpen()"
        class="grid grid-cols-1 overflow-y-auto transition-[grid-template-columns] duration-300"
    >
        <aside
            [class.-translate-x-full]="!sidebarOpen()"
            [class.translate-x-0]="sidebarOpen()"
            class="sidebar"
        >
            <ul class="flex flex-col">
                @for (item of getRange(34); track $index) {
                    <li>
                        <a
                            routerLink="responsive"
                            [relativeTo]="activatedRoute.parent"
                            class="py-1 px-2 block"
                            >Link {{ $index + 1 }}</a
                        >
                    </li>
                }
            </ul>
        </aside>
        <main class="flex flex-col min-w-0 min-h-0 overflow-y-auto px-3">
            <div class="mb-2">
                <app-poc-table-builder-basic></app-poc-table-builder-basic>
            </div>
            <footer class="border border-neutral-100 shadow-2xl mt-auto p-3">Footer</footer>
        </main>
    </div>
</div>
