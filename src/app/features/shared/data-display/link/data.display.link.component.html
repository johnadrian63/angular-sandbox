@if (isExternal) {
    <a [href]="redirectUrl()" [target]="target()" [ngClass]="classes" class="hover:underline">
        <ng-container *ngTemplateOutlet="linkContent"></ng-container>
    </a>
} @else {
    <a
        [routerLink]="url()"
        [routerLinkActive]="activeClass()"
        [queryParams]="returnUrlEnabled() ? queryParams : {}"
        [target]="target()"
        [ngClass]="classes"
    >
        <ng-container *ngTemplateOutlet="linkContent"></ng-container>
    </a>
}
<ng-template #linkContent>
    <span>{{ text() }}</span>
</ng-template>
