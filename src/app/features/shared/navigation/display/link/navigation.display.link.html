@if (!isExternal) {
    <a
        [routerLink]="menu().path"
        [routerLinkActive]="activeClass"
        [target]="target()"
        [ngClass]="classes"
    >
        <ng-container *ngTemplateOutlet="linkContent"></ng-container>
    </a>
} @else {
    <a [href]="menu().path" [target]="target()" [ngClass]="classes">
        <ng-container *ngTemplateOutlet="linkContent"></ng-container>
    </a>
}
<ng-template #linkContent>
    @if (iconLeft) {
        <fa-icon class="mr-1" [icon]="iconLeft"></fa-icon>
    }
    <span>{{ menu().text }}</span>
    @if (iconRight) {
        <fa-icon class="ml-1" [icon]="iconRight"></fa-icon>
    }
</ng-template>
