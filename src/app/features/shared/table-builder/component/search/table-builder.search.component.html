<form [formGroup]="formGroup" (ngSubmit)="apply()">
    <div class="flex">
        <div class="relative flex items-center">
            <input
                type="text"
                [placeholder]="placeholder"
                formControlName="searchText"
                class="p-2.5 border border-gray-400 border-r-0 focus:outline-none rounded-l pr-7 w-80"
            />
            @if (formGroup.get("searchText")?.value) {
                <span
                    (click)="clear()"
                    class="fa-solid fa-xmark absolute right-3 cursor-pointer"
                ></span>
            }
        </div>
        <button type="submit" class="border border-gray-400 bg-transparent px-3 rounded-r">
            <span class="fa-solid fa-magnifying-glass text-gray-500"></span>
        </button>
    </div>
</form>
