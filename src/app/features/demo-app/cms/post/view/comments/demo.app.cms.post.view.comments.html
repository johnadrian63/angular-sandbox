<!-- Comments -->
<section class="rounded-xl border border-gray-200 p-6 shadow-sm">
    <!-- Comments Header -->
    <div class="flex items-center justify-between">
        <div>
            <h3 class="text-sm font-semibold">Comments</h3>
            <p class="mt-1 text-xs">Discussion on this post</p>
        </div>

        <app-data-display-text
            [text]="`${totalComments} comments`"
            classes="rounded-full bg-gray-100 px-3 py-1 text-xs font-medium text-gray-600"
        ></app-data-display-text>
    </div>

    <div class="my-5 border-t border-gray-100"></div>

    <!-- Comment List -->
    <div class="space-y-6">
        @for (comment of commentsResource.value(); track comment.id) {
            <div class="flex gap-3">
                <!-- Avatar -->
                <div
                    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-indigo-50"
                >
                    <app-data-display-text
                        [text]="comment.user.fullName.charAt(0)"
                        classes="text-sm font-semibold text-indigo-600"
                    ></app-data-display-text>
                </div>

                <!-- Comment Content -->
                <div class="min-w-0 flex-1">
                    <!-- User Information -->
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <p class="text-sm font-semibold">
                                <app-data-display-text
                                    [text]="comment.user.fullName"
                                ></app-data-display-text>
                            </p>

                            <p class="mt-0.5 text-xs text-gray-500">
                                <app-data-display-text
                                    [text]="`@${comment.user.username}`"
                                ></app-data-display-text>
                                <span class="mx-1">·</span>
                                <app-data-display-text
                                    [text]="`User ${comment.user.id}`"
                                ></app-data-display-text>
                            </p>
                        </div>
                    </div>

                    <!-- Comment Body -->
                    <p class="mt-3 text-sm leading-6">
                        <app-data-display-text [text]="comment.body"></app-data-display-text>
                    </p>

                    <!-- Comment Footer -->
                    <div class="mt-3 flex items-center gap-2 text-gray-500">
                        <fa-icon [icon]="likeIcon" class="text-xs"></fa-icon>

                        <app-data-display-text
                            classes="text-xs font-medium flex items-center"
                            [text]="`${comment.likes} likes`"
                        ></app-data-display-text>

                        <span class="text-gray-300">·</span>

                        <app-data-display-text
                            classes="text-xs"
                            [text]="`Comment #${comment.id}`"
                        ></app-data-display-text>
                    </div>
                </div>
            </div>
        }

        @if (commentsResource.isLoading()) {
            <app-demo-cms-app-post-view-comments-skeleton></app-demo-cms-app-post-view-comments-skeleton>
        }

        @if (!commentsResource.isLoading() && totalComments === 0) {
            <div class="py-8 text-center">
                <fa-icon [icon]="commentIcon" class="text-2xl text-gray-300"></fa-icon>

                <p class="mt-3 text-sm font-medium">No comments yet</p>

                <p class="mt-1 text-xs text-gray-500">
                    There are no comments associated with this post.
                </p>
            </div>
        }
    </div>

    @if (hasNext) {
        <div class="mt-6 border-t border-gray-100 pt-5">
            <button
                (click)="loadMore()"
                type="button"
                class="load-more flex w-full items-center cursor-pointer justify-center gap-2 rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium transition disabled:cursor-not-allowed disabled:opacity-50"
            >
                @if (commentsResource.isLoading()) {
                    <span
                        class="h-4 w-4 animate-spin rounded-full border-2 border-gray-300 border-t-indigo-600"
                    >
                    </span>
                    Loading comments...
                } @else {
                    Load more comments
                }
            </button>
        </div>
    }
</section>
