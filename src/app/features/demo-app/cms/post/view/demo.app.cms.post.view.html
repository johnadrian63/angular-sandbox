<div class="mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <!-- <p class="text-sm ">Content Management / Posts</p> -->
            <h1 class="mt-1 text-2xl font-bold">Post Details</h1>
        </div>

        <div class="flex gap-2">
            <app-data-display-link
                text="Back"
                url="../../"
                activeClass="''"
                [returnUrlEnabled]="true"
                classes="rounded-lg cursor-pointer border border-gray-300 px-4 py-2 text-sm font-medium"
            ></app-data-display-link>
        </div>
    </div>

    <!-- Main Content -->
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
        <!-- Post Information -->
        <div class="space-y-6 lg:col-span-2">
            <section class="rounded-xl border border-gray-200 p-6 shadow-sm">
                <div class="mb-5 flex items-center justify-between">
                    <span class="text-xs font-semibold uppercase tracking-wider">
                        Post Content
                    </span>
                </div>

                <h2 class="text-2xl font-bold leading-tight">
                    <app-data-display-text [text]="post().title"></app-data-display-text>
                </h2>

                <div class="my-5 border-t border-gray-100"></div>

                <p class="text-sm leading-7">
                    <app-data-display-text [text]="post().body"></app-data-display-text>
                </p>
            </section>

            <!-- Tags -->
            <section class="rounded-xl border border-gray-200 p-6 shadow-sm">
                <h3 class="mb-4 text-sm font-semibold">Tags</h3>

                <div class="flex flex-wrap">
                    <app-demo-app-cms-post-display-tags
                        [tags]="post().tags"
                    ></app-demo-app-cms-post-display-tags>
                </div>
            </section>

            
        </div>

        <!-- Sidebar -->
        <div class="space-y-6">
            <!-- Engagement -->
            <section class="rounded-xl border border-gray-200 p-6 shadow-sm">
                <h3 class="mb-5 text-sm font-semibold">Engagement</h3>

                <div class="space-y-5">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <fa-icon [icon]="likeIcon" class="text-green-500"></fa-icon>
                            <span class="text-sm">Likes</span>
                        </div>
                        <span class="font-semibold">
                            <app-data-display-text
                                [text]="post().reactions.likes"
                            ></app-data-display-text>
                        </span>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <fa-icon [icon]="dislikeIcon" class="text-red-500"></fa-icon>
                            <span class="text-sm">Dislikes</span>
                        </div>
                        <span class="font-semibold">
                            <app-data-display-text
                                [text]="post().reactions.dislikes"
                            ></app-data-display-text>
                        </span>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <fa-icon [icon]="viewIcon"></fa-icon>
                            <span class="text-sm">Views</span>
                        </div>
                        <span class="font-semibold">
                            <app-data-display-text [text]="post().views"></app-data-display-text>
                        </span>
                    </div>
                </div>
            </section>

            <!-- Metadata -->
            <section class="rounded-xl border border-gray-200 p-6 shadow-sm">
                <h3 class="mb-4 text-sm font-semibold">Metadata</h3>

                <div class="space-y-4">
                    <div>
                        <p class="text-xs">Post ID</p>
                        <p class="mt-1 text-sm font-medium">
                            <app-data-display-text [text]="post().id"></app-data-display-text>
                        </p>
                    </div>

                    <div>
                        <p class="text-xs">Author ID</p>
                        <p class="mt-1 text-sm font-medium">
                            <app-data-display-text [text]="post().userId"></app-data-display-text>
                        </p>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
