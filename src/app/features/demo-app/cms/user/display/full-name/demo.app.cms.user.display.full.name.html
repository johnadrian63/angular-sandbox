<div class="flex items-center gap-x-1.5">
    <app-data-display-thumbnail
        width="30"
        height="30"
        [ngClass]="classes"
        [url]="imageUrl()"
    ></app-data-display-thumbnail>
    <app-data-display-link
        [text]="name()"
        [url]="url()"
        [returnUrlEnabled]="true"
    ></app-data-display-link>
</div>
