<div class="flex h-screen flex-col overflow-hi1dden">
    <nav class="fixed w-full z-20 top-0 inset-s-0 border-b border-default">
        <div class="max-w-7xl flex flex-wrap items-center justify-between mx-auto p-1.5">
            <a routerLink="/" class="flex items-center space-x-3 rtl:space-x-reverse">
                <span
                    class="self-center text-xl text-heading font-semibold whitespace-nowrap text-shadow-lg bg-amber-400 px-3 py-1.5 rounded-3xl italic border-orange-600 border-2 shadow-2xl"
                >
                    <span class="text-amber-700">Joh</span>NG.Sandbox</span
                >
            </a>

            <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
                <button
                    data-collapse-toggle="navbar-sticky"
                    type="button"
                    class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-body rounded-base md:hidden hover:text-heading focus:outline-none focus:ring-2 focus:ring-neutral-tertiary"
                    aria-controls="navbar-sticky"
                    aria-expanded="false"
                >
                    <span class="sr-only">Open main menu</span>
                    <svg
                        class="w-6 h-6"
                        aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        fill="none"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-width="2"
                            d="M5 7h14M5 12h14M5 17h14"
                        />
                    </svg>
                </button>
            </div>
            <div
                class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1"
                id="navbar-sticky"
            >
                <app-navigation-horizontal-cdk></app-navigation-horizontal-cdk>
            </div>
        </div>
    </nav>

    <div class="mt-11 min-h-0 flex-1 w-full pt-3">
        @if (loading()) {
            <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        }
        <router-outlet></router-outlet>
    </div>
</div>
