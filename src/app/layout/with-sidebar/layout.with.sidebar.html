@if (loading()) {
    <div class="w-full absolute z-30">
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
}
<div class="grid h-screen grid-rows-[auto_minmax(0,1fr)]">
    <!--header here-->
    <header class="fixed bottom-0 w-full">
        <router-outlet name="header"></router-outlet>
    </header>
    <div
        class="grid grid-cols-1 overflow-y-auto transition-[grid-template-columns] duration-300"
        [showClass]="'md:grid-cols-[250px_minmax(0,1fr)_auto]'"
        [hideClass]="'md:grid-cols-[0_minmax(0,1fr)_auto]'"
        sidebarTogglerPanel
    >
        <aside
            [class.-translate-x-full]="!sidebarOpen()"
            [class.translate-x-0]="sidebarOpen()"
            [hideClass]="'-translate-x-full'"
            [showClass]="'translate-x-0'"
            class="sidebar"
            sidebarTogglerPanel
        >
            <!--sidebar here-->
            <router-outlet name="sidebar"></router-outlet>
        </aside>
        <main class="flex flex-col min-w-0 min-h-0 overflow-y-auto p-3">
            <div class="mb-2">
                <router-outlet></router-outlet>
            </div>
            <footer class="mt-auto">
                <!--footer here-->
                <router-outlet name="footer"></router-outlet>
            </footer>
        </main>
    </div>
</div>
